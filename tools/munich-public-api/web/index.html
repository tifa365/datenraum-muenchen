<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datenraum München</title>
  <style>
    /* Shell modelled on the CIVORA UI layout used by smartes.augsburg.de (header + icon sidebar + iframe home). */
    :root { --brand: #005a9f; --brand-dark: #00467c; --ink: #0b1f33; --line: #e3e6ea; --hover: #eef1f3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: #fff; }
    .app { display: grid; grid-template-rows: auto 72px 1fr; grid-template-columns: 72px 1fr; height: 100vh; }
    /* Prototype notice in München yellow, first row of the shell */
    .proto { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px; padding: 7px 16px; background: #ffdd00; color: #111; font-size: 13px; line-height: 1.35; text-align: center; border-bottom: 1px solid #e0c200; }
    .proto b { text-transform: uppercase; letter-spacing: .6px; padding: 1px 7px; border: 1.5px solid #111; font-size: 11px; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 16px 0 40px; border-bottom: 1px solid var(--line); background: #fff; }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .mark { display: grid; line-height: 1.05; font-size: 10px; font-weight: 700; letter-spacing: .2px; }
    .mark span:first-child { font-weight: 400; }
    .title { font-size: 24px; color: #0a2540; white-space: nowrap; }
    .title::before { content: "|"; margin-right: 8px; }
    .actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; color: #333; }
    .icon-btn:hover { background: var(--hover); }
    .lang { display: flex; align-items: center; gap: 8px; border: 0; background: none; font-size: 17px; cursor: pointer; color: inherit; padding: 8px 10px; border-radius: 6px; }
    .lang:hover { background: var(--hover); }
    .login { display: inline-flex; align-items: center; gap: 10px; background: var(--brand); color: #fff; border: 0; border-radius: 6px; height: 40px; padding: 0 18px; font-size: 17px; cursor: pointer; }
    .login:hover { background: var(--brand-dark); }
    nav { grid-row: 3; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 24px; border-right: 1px solid var(--line); }
    nav a { width: 51px; height: 51px; display: grid; place-items: center; border-radius: 6px; color: #33415c; }
    nav a:hover { background: var(--hover); }
    nav a.active { background: #e5e8eb; color: var(--brand); }
    nav .bottom { margin-top: auto; }
    main { grid-row: 3; min-width: 0; min-height: 0; }
    main iframe { display: block; width: 100%; height: 100%; border: 0; }
    .toast { position: fixed; right: 16px; top: 120px; z-index: 10; max-width: 320px; padding: 12px 14px; background: #111317; color: #fff; font-size: 13px; line-height: 1.4; display: none; }
    .toast.show { display: block; }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 64px 1fr 60px; }
      .proto { font-size: 12px; padding: 6px 10px; }
      header { padding: 0 12px; gap: 10px; } .title { font-size: 18px; } .lang span, .mark { display: none; } .login { padding: 0 12px; font-size: 15px; }
      nav { grid-row: 4; flex-direction: row; justify-content: center; border-right: 0; border-top: 1px solid var(--line); padding: 4px; }
      nav .bottom { margin-top: 0; margin-left: auto; } main { grid-row: 3; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="proto" role="note">
      <b>Prototyp</b>
      <span>Inoffizielle Vorschau, keine Seite der Landeshauptstadt München. Daten teils eingefroren oder in Vorbereitung.</span>
    </div>
    <header>
      <a class="brand" href="./" aria-label="Datenraum München, Startseite">
        <span class="mark" aria-hidden="true"><span>Landeshauptstadt</span><span>München</span></span>
        <span class="title">Datenraum München</span>
      </a>
      <div class="actions">
        <button class="icon-btn" type="button" data-dummy="Infoseiten folgen." aria-label="Informationen">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01" stroke-linecap="round"/></svg>
        </button>
        <button class="lang" type="button" data-dummy="Die englische Fassung folgt." aria-label="Sprache wechseln: English">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 3 2.8 16 0 19M12 2.5c-2.8 3-2.8 16 0 19"/></svg>
          <span>English</span>
        </button>
        <button class="login" type="button" data-dummy="Die Anmeldung wird mit dem städtischen Login (Keycloak) angebunden.">Login
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <nav aria-label="Module">
      <a class="active" href="./" title="Home" aria-current="page">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z" stroke-linejoin="round"/></svg>
      </a>
      <a href="#" data-dummy="Die Smart City Map für München folgt." title="Smart City Map">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 4 20.5l8-4 8 4z" stroke-linejoin="round"/></svg>
      </a>
      <a class="bottom" href="#" data-dummy="Rechtliche Hinweise folgen." title="Rechtliche Hinweise">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 9.5" stroke-linejoin="round"/><rect x="13.5" y="14" width="7" height="6" rx="1"/><path d="M15 14v-1.5a2 2 0 0 1 4 0V14"/></svg>
      </a>
    </nav>

    <main>
      <iframe src="dashboard.html" title="Smart City Dashboard München"></iframe>
    </main>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    // Header and sidebar actions are placeholders until the backend modules exist.
    const toast = document.querySelector('.toast'); let timer
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-dummy]'); if (!el) return
      e.preventDefault(); toast.textContent = el.dataset.dummy; toast.classList.add('show')
      clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 3500)
    })
  </script>
</body>
</html>
